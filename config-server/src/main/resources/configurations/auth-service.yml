server:
  port: 9000
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sia_auth_db
    username: ${db-username}
    password: ${db-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
jwt:
  secret: ${jwt-token-secret}
  expiration:
    access-token: 600000   # 10 minutes
    refresh-token: 604800000 # 7 days